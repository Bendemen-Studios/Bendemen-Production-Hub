name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r agent/requirements.txt
      - run: python -m compileall -q app agent
      - run: PYTHONPATH=agent python -m unittest discover -s agent -p "test_*.py" -v
