services:
  production-hub:
    build: .
    container_name: bendemen-production-hub
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - hub-data:/data
    networks:
      - npm_proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hub-data:

networks:
  npm_proxy:
    external: true
    name: ${NPM_DOCKER_NETWORK:-nginx-proxy-manager_default}
