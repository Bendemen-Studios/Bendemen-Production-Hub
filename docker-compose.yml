services:
  production-hub:
    build: .
    container_name: bendemen-production-hub
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HUB_BIND_HOST:-127.0.0.1}:${HUB_BIND_PORT:-8000}:8000"
    volumes:
      - hub-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  hub-data:
